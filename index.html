<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Offline Land Dimension, Area Summation and Unit Calculator for Android">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LandCalculator">
  
  <title>LandCalculator</title>

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>📐</text></svg>">
  
  <!-- CSS Design System -->
  <link rel="stylesheet" href="./css/styles.css">
  <!-- Early Theme Initialization Script -->
  <script>
    (function() {
      try {
        const settings = JSON.parse(localStorage.getItem('land_calc_settings')) || {};
        const savedTheme = settings.theme;
        const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (systemPrefersDark ? 'dark' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', theme === 'light' ? '#f8fafc' : '#0f172a');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div id="app">
    <!-- App Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">📐</div>
        <div class="brand-title">LandCalculator</div>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="theme-toggle-btn" role="switch" aria-checked="false" aria-label="Switch between light and dark theme" title="Toggle Light/Dark Theme">
          <span class="theme-toggle-icon sun-icon">☀️</span>
          <span class="theme-toggle-icon moon-icon">🌙</span>
          <span class="theme-toggle-thumb"></span>
        </button>
        <button id="installPwaBtn" class="install-btn" aria-label="Install App">
          <span>📲</span> Install App
        </button>
      </div>
    </header>

    <!-- Offline Notification Banner -->
    <div id="offlineBanner" class="offline-banner">
      ⚡ Working Offline
    </div>

    <!-- Main View Content Container -->
    <main class="main-content">
      
      <!-- VIEW 1: Calculator Panel -->
      <section id="viewCalculator" class="view-panel active">
        
        <!-- Digital Calculator Screen -->
        <div class="calc-screen-card">
          <div class="calc-expression-bar">
            <span id="calcExpression">0</span>
          </div>

          <div class="calc-main-display">
            <span id="calcDisplay">0</span>
          </div>

          <div class="calc-subtitle-badge">
            <span id="calcHumanText" class="human-badge">0 Acres, 0 Guntas</span>
          </div>

          <div class="calc-conversions-bar" id="calcConversionsBar">
            <span>📐 <span id="calcSqFt">0</span> Sq Ft</span>
            <span class="dot-separator">•</span>
            <span><span id="calcSqYards">0</span> Sq Yds</span>
          </div>
        </div>

        <!-- Phone Calculator Keypad -->
        <div class="card calc-keypad-card">
          <div class="keypad-grid">
            <!-- Row 1 -->
            <button class="key-btn key-action" data-key="AC">AC</button>
            <button class="key-btn key-action" data-key="DEL">⌫</button>
            <button class="key-btn key-num" data-key="00">00</button>
            <button class="key-btn key-special" data-key="+" id="addParcelBtn" title="Add Land Parcel size">+ Add</button>

            <!-- Row 2 -->
            <button class="key-btn key-num" data-key="7">7</button>
            <button class="key-btn key-num" data-key="8">8</button>
            <button class="key-btn key-num" data-key="9">9</button>
            <span class="key-btn key-decorative" aria-hidden="true">🌾</span>

            <!-- Row 3 -->
            <button class="key-btn key-num" data-key="4">4</button>
            <button class="key-btn key-num" data-key="5">5</button>
            <button class="key-btn key-num" data-key="6">6</button>
            <span class="key-btn key-decorative" aria-hidden="true">🚜</span>

            <!-- Row 4 -->
            <button class="key-btn key-num" data-key="1">1</button>
            <button class="key-btn key-num" data-key="2">2</button>
            <button class="key-btn key-num" data-key="3">3</button>
            <button class="key-btn key-equals" data-key="=">=</button>

            <!-- Row 5 -->
            <button class="key-btn key-num key-zero" data-key="0">0</button>
            <button class="key-btn key-num" data-key=".">.</button>
            <span class="key-btn key-decorative" aria-hidden="true">🌿</span>
          </div>
        </div>

        <!-- Active Land Parcels List Breakdown -->
        <div class="card parcels-card">
          <div class="card-title">
            <div class="title-left">
              <span>🌾 Land Parcels List</span>
              <span id="parcelCountBadge" class="badge">0 Parcels</span>
            </div>
            <button id="clearParcelsBtn" class="btn-text-danger" title="Clear all parcels">Clear List</button>
          </div>

          <div id="parcelList" class="parcel-list-container">
            <div class="empty-parcel-state">
              <span>🌱</span>
              <p>No parcels added yet. Enter a size above and tap <strong>+ Add</strong> to add land sizes.</p>
            </div>
          </div>

          <!-- Total Summary Card -->
          <div id="totalSummaryCard" class="total-summary-box">
            <div class="summary-header">Total Combined Land</div>
            <div id="totalFormattedCode" class="summary-code">0.00</div>
            <div id="totalHumanText" class="summary-human">0 Acres, 0 Guntas</div>
            <div class="summary-conversions">
              <div><strong id="totalSqFtVal">0</strong> <small>Sq Ft</small></div>
              <div><strong id="totalSqYardsVal">0</strong> <small>Sq Yds</small></div>
              <div><strong id="totalSqMetersVal">0</strong> <small>Sq Mtr</small></div>
            </div>
          </div>
        </div>

      </section>

    </main>
  </div>

  <!-- Main JavaScript App Entry -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
